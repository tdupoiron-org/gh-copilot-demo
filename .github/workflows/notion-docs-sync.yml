name: Sync documentation to Notion

# Runs GitHub Copilot CLI whenever a pull request is merged into the default branch.
# Copilot uses the `notion-docs-updater` custom agent (.github/agents/), which loads the
# `notion-pr-docs-sync` skill (.github/skills/) as the authoritative workflow, and updates
# the documentation pages in Notion accordingly.

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to document (leave empty for the latest merged PR)
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  copilot-requests: write

concurrency:
  group: notion-docs-sync
  cancel-in-progress: false

jobs:
  update-notion-docs:
    # Only on an actual merge (a closed-without-merge PR must not trigger this),
    # or on a manual dispatch.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install album-viewer dependencies
        run: npm ci
        working-directory: album-viewer

      # The skill verifies the changed experience with Playwright before screenshotting.
      - name: Install Playwright browsers
        run: npx --yes playwright install --with-deps chromium

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      # github.com and the Copilot GitHub App resolve the Notion MCP server from the
      # registry; the CLI needs it declared locally.
      - name: Configure the Notion MCP server
        run: |
          mkdir -p "$HOME/.copilot"
          cat > "$HOME/.copilot/mcp-config.json" <<'JSON'
          {
            "mcpServers": {
              "notion": {
                "type": "local",
                "command": "npx",
                "args": ["-y", "@notionhq/notion-mcp-server"],
                "tools": ["*"],
                "env": {
                  "NOTION_TOKEN": "$NOTION_TOKEN"
                }
              }
            }
          }
          JSON

      - name: Update the Notion documentation
        env:
          # Copilot CLI authentication (headless).
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          # Notion integration token (ntn_...) shared with the docs pages.
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          # Optional discovery hint for the root Notion page.
          NOTION_DOCS_PAGE_ID: ${{ vars.NOTION_DOCS_PAGE_ID }}
          # Allow the repository-defined agent, skills and MCP servers to load in -p mode.
          GITHUB_COPILOT_PROMPT_MODE_WORKSPACE_MCP: 'true'
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -n "${PR_NUMBER}" ]; then
            TARGET_PR="pull request #${PR_NUMBER}"
          else
            TARGET_PR="the latest merged pull request on the default branch"
          fi

          copilot \
            --agent notion-docs-updater \
            --allow-all-tools \
            --no-ask-user \
            --log-level info \
            --secret-env-vars NOTION_TOKEN \
            -p "Run the \`notion-pr-docs-sync\` skill for ${TARGET_PR} in ${REPOSITORY}.

          The skill is the authoritative workflow: follow its inputs, procedure, safety
          constraints, completion checks and final report format exactly. Do not improvise
          an alternative process and do not modify anything in this repository."
