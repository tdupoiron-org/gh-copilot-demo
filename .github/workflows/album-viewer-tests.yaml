name: Album Viewer Tests

on:
  pull_request:
    paths:
      - "album-viewer/**"
      - ".github/workflows/album-viewer-tests.yaml"
  push:
    branches: [main]
    paths:
      - "album-viewer/**"
      - ".github/workflows/album-viewer-tests.yaml"

defaults:
  run:
    working-directory: ./album-viewer

jobs:
  test:
    name: Run tests with coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: album-viewer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Report coverage on pull request
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: album-viewer
